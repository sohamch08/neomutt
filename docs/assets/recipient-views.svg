<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="695" viewBox="0 0 1200 695" role="img" aria-label="What the recipient can read">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#546b7f"/></marker></defs>
<rect width="100%" height="100%" fill="#f6f8fb"/>
<text x="40" y="54" fill="#172c3c" font-size="29" font-weight="700" font-family="DejaVu Sans,sans-serif">What the recipient can read</text>
<text x="40" y="88" fill="#4d6070" font-size="17" font-family="DejaVu Sans,sans-serif">Illustrative mail views • actual wording and appearance depend on the recipient’s client</text>
<rect x="40" y="125" width="330" height="400" rx="14" fill="#dceaf8" stroke="#bfd0dd"/>
<text x="60" y="159" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">Signed only</text>
<text x="60" y="203" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">From: Soham</text>
<text x="60" y="236" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Subject: Meeting notes</text>
<text x="60" y="269" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif"></text>
<text x="60" y="302" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Hi Maya,</text>
<text x="60" y="335" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Here are the meeting notes.</text>
<text x="60" y="368" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif"></text>
<text x="60" y="401" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Attachment: notes.pdf</text>
<text x="60" y="434" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Optional: signature.asc</text>
<text x="48" y="566" fill="#4d6070" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">The body is readable.</text>
<text x="48" y="591" fill="#4d6070" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Public key + compatible client</text>
<text x="48" y="616" fill="#4d6070" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">are needed to verify the signature.</text>
<rect x="435" y="125" width="330" height="400" rx="14" fill="#ddf2e5" stroke="#bfd0dd"/>
<text x="455" y="159" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">Encrypted, supported</text>
<text x="455" y="203" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">From: Soham</text>
<text x="455" y="236" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Subject: Private meeting notes</text>
<text x="455" y="269" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif"></text>
<text x="455" y="302" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Decrypted successfully</text>
<text x="455" y="335" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Signature: valid / identity checked</text>
<text x="455" y="368" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif"></text>
<text x="455" y="401" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Hi Maya,</text>
<text x="455" y="434" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Here are the private notes.</text>
<text x="443" y="566" fill="#4d6070" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Recipient has the matching</text>
<text x="443" y="591" fill="#4d6070" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">private decryption key and</text>
<text x="443" y="616" fill="#4d6070" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">a compatible mail application.</text>
<rect x="830" y="125" width="330" height="400" rx="14" fill="#fff0cf" stroke="#bfd0dd"/>
<text x="850" y="159" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">Encrypted, unsupported</text>
<text x="850" y="203" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">From: Soham</text>
<text x="850" y="236" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Subject: ...</text>
<text x="850" y="269" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif"></text>
<text x="850" y="302" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Encrypted MIME part</text>
<text x="850" y="335" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif"></text>
<text x="850" y="368" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Attachment: encrypted.asc</text>
<text x="850" y="401" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif"></text>
<text x="850" y="434" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">[No readable body here]</text>
<text x="838" y="566" fill="#4d6070" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">The client/key setup cannot</text>
<text x="838" y="591" fill="#4d6070" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">decrypt this message. Your</text>
<text x="838" y="616" fill="#4d6070" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">public key alone is not enough.</text>
<text x="40" y="670" fill="#172c3c" font-size="17" font-weight="700" font-family="DejaVu Sans,sans-serif">Signing checks authenticity/integrity. Encryption controls who can read the protected content.</text>
</svg>