<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="What happens when you open an encrypted email">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#546b7f"/></marker></defs>
<rect width="100%" height="100%" fill="#f6f8fb"/>
<text x="40" y="54" fill="#172c3c" font-size="29" font-weight="700" font-family="DejaVu Sans,sans-serif">What happens when you open an encrypted email</text>
<text x="40" y="88" fill="#4d6070" font-size="17" font-family="DejaVu Sans,sans-serif">Encrypted source → private-key operation → readable display</text>
<rect x="40" y="135" width="300" height="135" rx="14" fill="#dceaf8" stroke="#bfd0dd"/>
<text x="60" y="169" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">1. Stored message</text>
<text x="60" y="202" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Outer headers are visible.</text>
<text x="60" y="227" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">PGP/MIME body is ciphertext.</text>
<text x="60" y="252" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Disk protection is separate.</text>
<rect x="450" y="135" width="300" height="135" rx="14" fill="#dceaf8" stroke="#bfd0dd"/>
<text x="470" y="169" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">2. NeoMutt + GPGME</text>
<text x="470" y="202" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Recognize encrypted MIME.</text>
<text x="470" y="227" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Ask GnuPG to decrypt.</text>
<text x="470" y="252" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Locate the matching secret key.</text>
<rect x="860" y="135" width="300" height="135" rx="14" fill="#fff0cf" stroke="#bfd0dd"/>
<text x="880" y="169" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">3. GnuPG + agent</text>
<text x="880" y="202" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Use a private key or token.</text>
<text x="880" y="227" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Prompt if unlocking is needed.</text>
<text x="880" y="252" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Reuse unlock while policy allows.</text>
<path d="M355,203 L435,203" stroke="#546b7f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M765,203 L845,203" stroke="#546b7f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="860" y="362" width="300" height="135" rx="14" fill="#ddf2e5" stroke="#bfd0dd"/>
<text x="880" y="396" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">4. Readable mail</text>
<text x="880" y="429" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Display text and attachments.</text>
<text x="880" y="454" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Check an embedded signature.</text>
<text x="880" y="479" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Show the security status.</text>
<path d="M1010,282 L1010,346" stroke="#546b7f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="347" width="675" height="165" rx="14" fill="#f6f8fb" stroke="#bfd0dd"/>
<text x="60" y="381" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">The source can remain encrypted</text>
<text x="60" y="414" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Normal viewing need not replace the original ciphertext.</text>
<text x="60" y="439" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Plaintext exists in the application while it is displayed.</text>
<text x="60" y="464" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Temporary files, header caches, viewers and editors may retain copies.</text>
<text x="60" y="489" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Protect these paths too; display is not a “no plaintext ever” guarantee.</text>
<text x="40" y="573" fill="#172c3c" font-size="17" font-weight="400" font-family="DejaVu Sans,sans-serif">First message: an unlock prompt may appear. Later messages: automatic while the key/agent policy permits.</text>
<text x="40" y="602" fill="#172c3c" font-size="17" font-weight="400" font-family="DejaVu Sans,sans-serif">A Gmail app password authenticates to Gmail; it does not unlock your OpenPGP private key.</text>
</svg>