<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-label="Four layers. Four different promises.">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#546b7f"/></marker></defs>
<rect width="100%" height="100%" fill="#f6f8fb"/>
<text x="40" y="54" fill="#172c3c" font-size="29" font-weight="700" font-family="DejaVu Sans,sans-serif">Four layers. Four different promises.</text>
<text x="40" y="88" fill="#4d6070" font-size="17" font-family="DejaVu Sans,sans-serif">NeoMutt encryption guide • conceptual diagram, not a screenshot</text>
<text x="40" y="140" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">01  TLS connection</text>
<rect x="292" y="120" width="285" height="85" rx="14" fill="#dceaf8" stroke="#bfd0dd"/>
<text x="312" y="154" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">Your mail client</text>
<text x="312" y="187" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">MIME before transport</text>
<rect x="715" y="120" width="285" height="85" rx="14" fill="#dceaf8" stroke="#bfd0dd"/>
<text x="735" y="154" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">Mail server</text>
<text x="735" y="187" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">MIME after transport</text>
<path d="M592,164 L700,164" stroke="#546b7f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="292" y="231" fill="#4d6070" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Protects the network hop; the message may still be readable at each end.</text>
<text x="40" y="282" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">02  Encrypted storage</text>
<rect x="292" y="262" width="285" height="85" rx="14" fill="#ddf2e5" stroke="#bfd0dd"/>
<text x="312" y="296" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">Locked disk / volume</text>
<text x="312" y="329" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Ciphertext blocks</text>
<rect x="715" y="262" width="285" height="85" rx="14" fill="#ddf2e5" stroke="#bfd0dd"/>
<text x="735" y="296" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">Unlocked filesystem</text>
<text x="735" y="329" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Programs see readable files</text>
<path d="M592,306 L700,306" stroke="#546b7f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="292" y="373" fill="#4d6070" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Protects covered storage while locked; does not change what recipients receive.</text>
<text x="40" y="424" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">03  Message content</text>
<rect x="292" y="404" width="285" height="85" rx="14" fill="#fff0cf" stroke="#bfd0dd"/>
<text x="312" y="438" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">Sender encrypts</text>
<text x="312" y="471" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Recipient public key(s)</text>
<rect x="715" y="404" width="285" height="85" rx="14" fill="#fff0cf" stroke="#bfd0dd"/>
<text x="735" y="438" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">Recipient decrypts</text>
<text x="735" y="471" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Matching private key</text>
<path d="M592,448 L700,448" stroke="#546b7f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="292" y="515" fill="#4d6070" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Keeps MIME content encrypted through storage and transport; outer metadata remains.</text>
<text x="40" y="566" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">04  Digital signature</text>
<rect x="292" y="546" width="285" height="85" rx="14" fill="#f8e3df" stroke="#bfd0dd"/>
<text x="312" y="580" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">Sender signs</text>
<text x="312" y="613" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Private signing key</text>
<rect x="715" y="546" width="285" height="85" rx="14" fill="#f8e3df" stroke="#bfd0dd"/>
<text x="735" y="580" fill="#172c3c" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">Recipient verifies</text>
<text x="735" y="613" fill="#172c3c" font-size="16" font-weight="400" font-family="DejaVu Sans,sans-serif">Authentic public key</text>
<path d="M592,590 L700,590" stroke="#546b7f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="292" y="657" fill="#4d6070" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Checks signed-content integrity and key identity; does not conceal the message.</text>
</svg>